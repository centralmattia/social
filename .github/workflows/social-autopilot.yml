name: Central Social Autopilot
# Pubblica SOLO le bozze approvate (status "pending") la cui ora (due_at in queue.json) è passata.
# Gli orari non si scrivono qui: stanno in queue.json, proposti da Claude e confermati da te.
# L'Action scrive solo publish_state.json (stato dei post); queue.json lo modifichi solo tu: nessun conflitto.
# Il controllo parte ogni 30 minuti tra le 05:00 e le 20:30 UTC (06:00-22:30 ora italiana, 07:00-23:30 con ora legale):
# GitHub può ritardare l'avvio anche di 15-30 minuti, quindi l'orario reale è approssimativo.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run oppure live (solo bozze già approvate)"
        required: true
        type: choice
        options: [dry-run, live]
        default: dry-run
  schedule:
    - cron: "*/30 5-20 * * *"
permissions:
  contents: write
concurrency:
  group: central-social-autopilot
  cancel-in-progress: false
jobs:
  publish-approved-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_LIVE_PUBLISH: ${{ vars.ALLOW_LIVE_PUBLISH }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Publish approved queue or dry-run
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_TIKTOK: ${{ vars.BUFFER_CHANNEL_TIKTOK }}
        run: |
          if [ "$RUN_MODE" = "live" ] && [ "$ALLOW_LIVE_PUBLISH" = "true" ]; then
            python publisher.py --live
          else
            python publisher.py --dry-run
          fi
      - name: Persist queue state
        # always(): se la pubblicazione fallisce dopo aver pubblicato un post, lo stato va salvato comunque (niente doppioni)
        if: ${{ always() && env.RUN_MODE == 'live' && env.ALLOW_LIVE_PUBLISH == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f publish_state.json ]; then exit 0; fi
          git add publish_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: persist Central social queue state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
